[package]
name = "opencode-egui"
version = "0.0.1"
edition = "2024"
license = "MIT"

[dependencies]
# GUI (using forks for left-right modifier support and compatibility)
egui = { git = "https://github.com/TonyMarkham/egui.git", branch = "feature/left-right-modifiers" }
eframe = { git = "https://github.com/TonyMarkham/egui.git", branch = "feature/left-right-modifiers" }
egui_commonmark = { git = "https://github.com/TonyMarkham/egui_commonmark.git", branch = "feature/use-fork-of-egui" }
egui_extras = { git = "https://github.com/TonyMarkham/egui.git", branch = "feature/left-right-modifiers", features = ["svg", "image"] }
egui-twemoji = { git = "https://github.com/TonyMarkham/egui-twemoji.git", branch = "feature/support-my-egui-fork" }

# Async & HTTP
tokio = { version = "1.43", features = ["rt-multi-thread", "macros", "signal", "process", "io-util"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
regex = "1.11"

# Cross-platform process and port discovery
sysinfo = "0.30"
netstat2 = "0.9"

# Serialization & config
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
directories = "6.0"

# Errors
thiserror = "2.0"

# Utilities
futures = "0.3"
futures-util = "0.3"
reqwest-eventsource = "0.6"

# Audio (STT)
cpal = "0.15"
rubato = "0.15"
whisper-rs = "0.15"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[patch.crates-io]
egui = { git = "https://github.com/TonyMarkham/egui.git", branch = "feature/left-right-modifiers" }

[workspace]
resolver = "2"
